# Local run: ./gradlew bootJar && docker compose up --build
services:
  app:
    build: .
    image: teletronics-storage:local
    ports:
      - "8080:8080"
    # The brief's 1 GB memory limit; swap equal to memory so it is really 1 GB (system.md).
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/teletronics
      STORAGE_S3_ENDPOINT: http://seaweedfs:8333
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: files
      STORAGE_S3_ACCESS_KEY: teletronics
      STORAGE_S3_SECRET_KEY: teletronics-secret
    depends_on:
      mongo:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20
    volumes:
      - mongo-data:/data/db

  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    command: ["server", "-s3"]
    environment:
      # Becomes a static admin identity for the S3 gateway.
      AWS_ACCESS_KEY_ID: teletronics
      AWS_SECRET_ACCESS_KEY: teletronics-secret
    ports:
      - "8333:8333"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8333/healthz"]
      interval: 5s
      retries: 20
    volumes:
      - seaweed-data:/data

volumes:
  mongo-data: {}
  seaweed-data: {}
